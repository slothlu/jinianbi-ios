# ============================================================
# 路面纪念钞币科技 · iOS 独立 App 一键云打包（GitHub 云 Mac）v3.1
# 用途：把 App 源码 zip 转成 iPhone 可安装的 .ipa（未签名）
# 触发：推送代码到 main 分支，或在 Actions 页手动「Run workflow」
# 要求：仓库必须 Public（macOS 免费构建额度只对公开仓库开放）
# 亮点：v3.1 用 Python 解压，自动修正 Windows 反斜杠路径与
#       多余嵌套文件夹，任何压缩工具打的 zip 都能正确解开
# ============================================================
name: 打包iOS独立App-生成未签名IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 定位源码 zip（取最新一个）
        run: |
          set -e
          ZIP=$(find . -maxdepth 4 -iname "*.zip" -not -path "./.github/*" -print0 \
                | xargs -0 ls -t | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "错误：仓库根目录没有源码 zip，请先上传 zip 再运行"
            exit 1
          fi
          echo "选用 zip: $ZIP"
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: 解压并定位源码根目录（Python 自动修正反斜杠与嵌套）
        run: |
          set -e
          echo "选用 zip: $ZIP_FILE"
          rm -rf app_src
          python3 - "$ZIP_FILE" <<'EOF'
import zipfile, os, shutil, sys
zip_path = sys.argv[1]
out = "app_src"
os.makedirs(out, exist_ok=True)
z = zipfile.ZipFile(zip_path)
count = 0
for name in z.namelist():
    # 关键：把 Windows 反斜杠路径修正为正斜杠
    fixed = name.replace("\\", "/")
    target = os.path.join(out, fixed)
    if fixed.endswith("/"):
        os.makedirs(target, exist_ok=True)
        continue
    os.makedirs(os.path.dirname(target), exist_ok=True)
    with z.open(name) as src, open(target, "wb") as dst:
        shutil.copyfileobj(src, dst)
    count += 1
print(f"解压完成：{count} 个文件（反斜杠已自动修正为正斜杠）")
EOF
          ls -la app_src
          # 容错：若顶层是嵌套目录（如 app_src/project.yml 不存在但子目录里有），自动上提一层
          if [ ! -f app_src/project.yml ]; then
            SUB=$(ls -d app_src/*/ 2>/dev/null | head -n 1)
            if [ -n "$SUB" ] && [ -f "$SUB/project.yml" ]; then
              echo "检测到嵌套目录 $SUB，自动上提"
              mv "$SUB"/* app_src/ 2>/dev/null || true
              rm -rf "$SUB"
            fi
          fi
          test -f app_src/project.yml || { echo "错误：zip 里找不到 project.yml，原料不对"; exit 1; }
          echo "project.yml 就位 ✓"

      - name: 校验版本号与关键资源
        run: |
          set -e
          cd app_src
          echo "--- Info.plist 版本 ---"
          grep -A1 "CFBundleShortVersionString" Sources/Info.plist || true
          grep -A1 "CFBundleVersion" Sources/Info.plist || true
          echo "--- 关键资源检查 ---"
          for f in home.html content.js style_patch.js date_fill.js bridge_ios.js; do
            test -f "Sources/WebAssets/web/$f" || { echo "错误：$f 缺失"; exit 1; }
          done
          echo "资源齐全 ✓"

      - name: 生成 Xcode 工程
        run: |
          set -e
          cd app_src
          xcodegen generate
          ls -la
          xcodebuild -list -project LuMianJiNianBi.xcodeproj 2>&1 | head -30 || true

      - name: 安装 iOS 平台与模拟器运行时
        run: |
          set -e
          xcodebuild -downloadPlatform iOS 2>&1 | tail -5 || echo "已存在，继续"

      - name: 构建未签名 .app（Release / 真机 iphoneos）
        run: |
          set -e
          cd app_src
          set +e
          xcodebuild \
            -project LuMianJiNianBi.xcodeproj \
            -scheme LuMianJiNianBi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            ASSETCATALOG_GENERATE_SWIFT_ASSET_SYMBOLS=NO \
            ASSETCATALOG_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            ASSETCATALOG_GENERATE_OBJC_ASSET_SYMBOLS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -ne 0 ]; then
            echo "======== 构建失败，关键错误 ========"
            grep -nE "error:|Error:|failed|unable to|actool|CompileAssetCatalog|AppIcon|Alpha" build.log | head -60 || true
            echo "======== build.log 最后 50 行 ========"
            tail -50 build.log || true
            exit $RC
          fi

      - name: 上传失败日志（便于分析报错）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: app_src/build.log
          if-no-files-found: ignore

      - name: 打包成 .ipa（未签名）
        run: |
          set -e
          APP=$(find ./app_src/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP" || { echo "错误：没有生成 .app"; exit 1; }
          find "$APP" -name "content.js" | head -1 || { echo "错误：content.js 没有被打进 App"; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" 2>/dev/null || echo "unknown")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist" 2>/dev/null || echo "unknown")
          echo "App 版本: $VERSION (build $BUILD)"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y "LuMianJiNianBi-App-v${VERSION}-unsigned.ipa" Payload
          echo "--- 生成的 IPA ---"
          ls -la LuMianJiNianBi-App-*.ipa
          echo "IPA_NAME=LuMianJiNianBi-App-v${VERSION}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: LuMianJiNianBi-iOS-unsigned-IPA
          path: LuMianJiNianBi-App-*.ipa
          if-no-files-found: error
          retention-days: 14
