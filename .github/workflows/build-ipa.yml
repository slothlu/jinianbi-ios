name: 打包iOS独立App-生成未签名IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 查看环境
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen 2.38（兼容 Xcode 15）
        run: |
          set -e
          curl -L -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          unzip -o xcodegen.zip -d xcodegen-bin
          echo "$PWD/xcodegen-bin/xcodegen/bin" >> $GITHUB_PATH
          "$PWD/xcodegen-bin/xcodegen/bin/xcodegen" --version

      - name: 找到并解压 App 源码 zip
        run: |
          set -e
          ZIP=$(find . -maxdepth 4 -name "*.zip" -not -path "./.github/*" | head -n 1)
          echo "找到 zip: $ZIP"
          if [ -z "$ZIP" ]; then
            echo "错误：仓库里没有 App 源码 zip"
            exit 1
          fi
          mkdir -p app_src
          unzip -o "$ZIP" -d app_src
          echo "--- 解压结果（应包含 project.yml 和 Sources/WebAssets）---"
          ls -la app_src
          ls -la app_src/Sources | head -20
          test -f app_src/project.yml || { echo "错误：zip 里没有 project.yml"; exit 1; }
          test -d app_src/Sources/WebAssets || { echo "错误：zip 里没有 Sources/WebAssets"; exit 1; }

      - name: 生成 Xcode 工程
        run: |
          set -e
          cd app_src
          xcodegen generate
          echo "--- 生成的工程 ---"
          ls -la
          xcodebuild -list -project LuMianJiNianBi.xcodeproj 2>&1 || true

      - name: 构建未签名 .app
        run: |
          set -e
          cd app_src
          xcodebuild \
            -project LuMianJiNianBi.xcodeproj \
            -scheme LuMianJiNianBi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 检查 App 结构
        run: |
          set -e
          APP=$(find ./app_src/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "生成的 App: $APP"
          test -n "$APP" || { echo "错误：没有生成 .app"; exit 1; }
          echo "--- App 内资源文件列表 ---"
          find "$APP" -type f | head -60
          echo "--- 自检首页与脚本 ---"
          find "$APP" -name "home.html" | head -1 || { echo "错误：home.html 没有被打进 App"; exit 1; }
          find "$APP" -name "content.js" | head -1 || { echo "错误：content.js 没有被打进 App"; exit 1; }
          echo "App 结构正常，资源齐全"

      - name: 打包成 .ipa（未签名）
        run: |
          set -e
          APP=$(find ./app_src/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y LuMianJiNianBi-App-unsigned.ipa Payload
          echo "--- 生成的 IPA ---"
          ls -la LuMianJiNianBi-App-unsigned.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: LuMianJiNianBi-iOS-App-unsigned-IPA
          path: LuMianJiNianBi-App-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
