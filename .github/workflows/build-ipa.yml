# ============================================================
# 路面纪念钞币科技 · iOS 独立 App 一键打包（GitHub 云 Mac）
# 用途：把 App 源码 zip 转换成 iPhone 可安装的 .ipa（未签名）
# 触发：在 GitHub Actions 页面手动点「Run workflow」
# 要求：仓库必须设为 Public（macOS 构建器免费额度只对公开仓库生效）
# 安装：未签名 IPA 需要企业签名后，在 iPhone
#       「设置 → 通用 → VPN 与设备管理」信任后安装
# ============================================================
name: 打包iOS独立App-生成未签名IPA

on:
  workflow_dispatch:      # 手动触发
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14     # GitHub 的云 Mac，自带 Xcode
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 查看环境
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen 2.38（兼容 Xcode 15）
        run: |
          set -e
          curl -L -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          unzip -o xcodegen.zip -d xcodegen-bin
          echo "$PWD/xcodegen-bin/xcodegen/bin" >> $GITHUB_PATH
          "$PWD/xcodegen-bin/xcodegen/bin/xcodegen" --version

      - name: 找到并解压 App 源码 zip
        run: |
          set -e
          ZIP=$(find . -maxdepth 4 -name "*.zip" -not -path "./.github/*" | head -n 1)
          echo "找到 zip: $ZIP"
          if [ -z "$ZIP" ]; then
            echo "错误：仓库里没有 App 源码 zip"
            exit 1
          fi
          mkdir -p app_src
          unzip -o "$ZIP" -d app_src
          echo "--- 解压结果（应包含 project.yml）---"
          ls -la app_src
          test -f app_src/project.yml || { echo "错误：zip 里没有 project.yml，原料不对"; exit 1; }

      - name: 生成 Xcode 工程
        run: |
          set -e
          cd app_src
          xcodegen generate
          echo "--- 生成的工程 ---"
          ls -la
          xcodebuild -list -project LuMianJiNianBi.xcodeproj 2>&1 || true

      - name: 构建未签名 .app
        run: |
          set -e
          cd app_src
          xcodebuild \
            -project LuMianJiNianBi.xcodeproj \
            -scheme LuMianJiNianBi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 检查 App 结构
        run: |
          set -e
          APP=$(find ./app_src/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "生成的 App: $APP"
          test -n "$APP" || { echo "错误：没有生成 .app"; exit 1; }
          ls -la "$APP" | head -20
          test -f "$APP/Info.plist" || { echo "错误：缺少 Info.plist"; exit 1; }
          echo "App 结构正常"

      - name: 打包成 .ipa（未签名）
        run: |
          set -e
          APP=$(find ./app_src/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y LuMianJiNianBi-App-unsigned.ipa Payload
          echo "--- 生成的 IPA ---"
          ls -la LuMianJiNianBi-App-unsigned.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: LuMianJiNianBi-iOS-App-unsigned-IPA
          path: LuMianJiNianBi-App-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
