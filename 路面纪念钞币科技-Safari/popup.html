<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>路面纪念钞币科技</title>
    <style>
      html,
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        width: 360px;
        max-width: 100vw;
        background: #ffffff;
        color: #111827;
        box-sizing: border-box;
      }
      body {
        padding: 12px 16px 14px;
        overflow-y: auto;
      }
      /* 手机端：全屏显示、触屏加大按钮 */
      @media (max-width: 560px) {
        html,
        body {
          width: 100%;
          min-height: 100vh;
          min-height: 100dvh;
        }
        body {
          padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
        }
        h1 {
          font-size: 20px;
        }
        input,
        select {
          padding: 10px 12px !important;
          font-size: 15px !important;
          border-radius: 12px !important;
        }
        .btn {
          padding: 13px;
          font-size: 15px;
        }
        .field-label {
          font-size: 13px;
        }
        .person-list {
          max-height: none !important;
        }
        .person-card {
          padding: 14px;
        }
        .btn-small {
          padding: 7px 14px;
          font-size: 13px;
        }
      }
      .popup-shell {
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        padding: 0;
        box-sizing: border-box;
        border: none;
      }
      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e5e7eb;
      }
      .back-btn {
        background: transparent;
        border: none;
        color: #2563eb;
        font-size: 14px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        transition: background 0.2s;
      }
      .back-btn:hover {
        background: rgba(37, 99, 235, 0.1);
      }
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        font-size: 13px;
        outline: none;
        background: #ffffff;
      }
      select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.35);
      }
      .btn-secondary {
        background: #6b7280;
      }
      .btn-secondary:active {
        background: #4b5563;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #0f172a;
      }
      .header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .brand-subtitle {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 2px;
      }

      .field-label {
        font-size: 12px;
        color: #374151;
        margin-bottom: 4px;
      }
      .card {
        background: transparent;
        border-radius: 0;
        padding: 12px 0 0;
        box-shadow: none;
        margin-bottom: 8px;
        border: none;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        font-size: 13px;
        outline: none;
      }
      input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.35);
      }
      .btn {
        width: 100%;
        padding: 8px;
        margin-top: 8px;
        border: none;
        border-radius: 999px;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.12s ease;
      }
      .btn:hover {
        background: #1d4ed8;
        box-shadow: 0 10px 22px rgba(37, 99, 235, 0.32);
        transform: translateY(-0.5px);
      }
      .btn:active {
        background: #1e40af;
        box-shadow: 0 6px 14px rgba(30, 64, 175, 0.3);
        transform: translateY(0);
      }
      .toast {
        position: fixed;
        left: 12px;
        right: 12px;
        top: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        font-size: 12px;
        line-height: 1.4;
        color: #0f172a;
        background: linear-gradient(135deg, #d1fae5, #bbf7d0);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
        opacity: 0;
        transform: translateY(-8px);
        pointer-events: none;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .toast.error {
        background: linear-gradient(135deg, #fee2e2, #fecaca);
        color: #7f1d1d;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .loading-mask {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .loading-mask.show {
        opacity: 1;
        pointer-events: auto;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid rgba(148, 163, 184, 0.6);
        border-top-color: #2563eb;
        animation: spin 0.7s linear infinite;
        margin-right: 8px;
      }
      .loading-text {
        font-size: 12px;
        color: #4b5563;
      }
      .loading-inner {
        display: flex;
        align-items: center;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(248, 250, 252, 0.95);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .person-card {
        background: #ffffff;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.07);
        border: 1px solid #e5e7eb;
      }
      .person-card-wrapper {
        margin-bottom: 10px;
      }
      .edit-form-inline {
        background: #f9fafb;
        border-radius: 10px;
        padding: 12px;
        margin-top: 12px;
        border: 1px dashed #2563eb;
      }
      .person-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .person-card-header.editing {
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 8px;
        margin-bottom: 8px;
      }
      .person-card-name {
        font-size: 14px;
        font-weight: 600;
        color: #111827;
      }
      .person-card-actions {
        display: flex;
        gap: 6px;
      }
      .btn-small {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        margin: 0;
        width: auto;
      }
      .btn-edit {
        background: #2563eb;
        color: #fff;
      }
      .btn-edit:hover {
        background: #1e40af;
      }
      .btn-delete {
        background: #ef4444;
        color: #fff;
      }
      .btn-delete:hover {
        background: #dc2626;
      }
      .person-card-info {
        font-size: 12px;
        color: #6b7280;
        line-height: 1.6;
      }
      .person-card-info-item {
        margin-bottom: 4px;
      }
      .person-list {
        max-height: 400px;
        overflow-y: auto;
        margin-bottom: 12px;
      }
      .add-form {
        background: #f9fafb;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
        border: 1px dashed #d1d5db;
      }
      .add-form-title {
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 10px;
      }
      .form-buttons {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .form-buttons .btn {
        margin: 0;
        flex: 1;
      }
      .btn-cancel {
        background: #6b7280;
      }
      .btn-cancel:active {
        background: #4b5563;
      }
      .empty-state {
        text-align: center;
        padding: 20px;
        color: #9ca3af;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="popup-shell">
      <div class="header-bar">
        <div>
          <h1>路面纪念钞币科技</h1>
          <div class="brand-subtitle">银行预约填表助手</div>
        </div>

      </div>

      <div id="feature-section" class="card">
      <button id="activate-script-btn" class="btn" style="margin-top: 8px">
        激活脚本
      </button>
      <button id="settings-btn" class="btn btn-secondary" style="margin-top: 8px">
        设置
      </button>
    </div>

      <div id="settings-section" style="display: none">
      <div class="page-header">
        <h2 style="font-size: 16px; margin: 0">设置</h2>
        <button id="back-btn" class="back-btn">← 返回</button>
      </div>

      <!-- 人员列表 -->
      <div id="person-list" class="person-list"></div>

      <!-- 添加/编辑表单 -->
      <div id="add-form-container" class="add-form" style="display: none">
        <div class="add-form-title" id="form-title">添加人员</div>
        
        <div class="field-label">姓名</div>
        <input id="name-input" type="text" placeholder="请输入姓名" />

        <div class="field-label" style="margin-top: 10px">备注（仅用于显示）</div>
        <input id="remark-input" type="text" placeholder="请输入人员备注" />
        
        <div class="field-label" style="margin-top: 10px">手机号码</div>
        <input id="phone-input" type="tel" placeholder="请输入手机号码" />
        
        <div class="field-label" style="margin-top: 10px">身份证号码</div>
        <input id="idcard-input" type="text" placeholder="请输入身份证号码" />
        
        <div class="field-label" style="margin-top: 10px">省份</div>
        <input id="province-input" type="text" placeholder="请输入省份" />
        
        <div class="field-label" style="margin-top: 10px">城市</div>
        <input id="city-input" type="text" placeholder="请输入城市" />
        
        <div class="field-label" style="margin-top: 10px">区/县</div>
        <input id="district-input" type="text" placeholder="请输入区/县" />
        
        <div class="field-label" style="margin-top: 10px">网点</div>
        <input id="branch-input" type="text" placeholder="请输入网点" />
        
        <div class="field-label" style="margin-top: 10px">兑换日期</div>
        <input id="exchange-time-input" type="date" placeholder="请选择兑换日期" />
        
        <div class="field-label" style="margin-top: 10px">预约数量</div>
        <input id="quantity-input" type="number" placeholder="请输入预约数量" min="1" />
        
        <div class="form-buttons">
          <button id="save-person-btn" class="btn">保存</button>
          <button id="cancel-form-btn" class="btn btn-cancel">取消</button>
        </div>
      </div>

      <!-- 添加按钮 -->
      <button id="add-person-btn" class="btn">+ 添加人员</button>
    </div>

      <div id="toast" class="toast"></div>

      <div id="loading-mask" class="loading-mask">
      <div class="loading-inner">
        <div class="spinner"></div>
        <div class="loading-text">加载中...</div>
      </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
